name: Deploy Blazor WebAssembly to GitHub Pages

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Blazor App
        run: dotnet publish BlazorApp1/BlazorApp1.csproj -c Release -o publish_site -p:StaticWebAssetBasepath=Soggz-Bloggz

      - name: Set base href
        run: |
          sed -i 's|<base href="/" />|<base href="/Soggz-Bloggz/" />|g' publish_site/wwwroot/index.html

      - name: Copy index.html to 404.html
        run: cp publish_site/wwwroot/index.html publish_site/wwwroot/404.html

      - name: Add .nojekyll file
        run: touch publish_site/wwwroot/.nojekyll

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish_site/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
