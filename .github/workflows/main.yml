name: Deploy Blazor WebAssembly to GitHub Pages

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      # 1. Pull down repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install .NET 10 SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      # 3. Automatically locate the project file
      - name: Detect project
        id: find_project
        run: |
          proj=$(find . -maxdepth 6 -name '*.csproj' | head -n 1)
          if [ -z "$proj" ]; then
            echo "No .csproj found"
            exit 1
          fi
          echo "project=$proj" >> $GITHUB_OUTPUT

      # 4. Compile and publish Blazor WebAssembly
      - name: Publish Blazor App
        run: dotnet publish "${{ steps.find_project.outputs.project }}" -c Release -o release

      # 5. Copy index.html to 404.html for SPA sub-route support
      - name: Copy index.html to 404.html
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      # 6. Package compiled static files
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

      # 7. Publish to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
