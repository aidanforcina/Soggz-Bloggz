name: Deploy Blazor WebAssembly to GitHub Pages

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: List repo and find .csproj (debug)
        run: |
          echo "Working directory: $PWD"
          ls -la
          find . -maxdepth 6 -type f -name '*.csproj' -print || true

      - name: Detect project
        id: find_project
        run: |
          proj=$(find . -maxdepth 6 -name '*.csproj' | head -n 1)
          if [ -z "$proj" ]; then
            echo "No .csproj found"
            exit 1
          fi
          echo "Found project: $proj"
          echo "project=$proj" >> $GITHUB_OUTPUT

      - name: Publish Blazor App
        run: dotnet publish "${{ steps.find_project.outputs.project }}" -c Release -o release

      - name: Set base href
        uses: SteveSandersonMS/ghaction-rewrite-base-href@v1
        with:
          html_path: release/wwwroot/index.html
          base_href: /Soggz-Bloggz/

      - name: Copy index.html to 404.html
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
